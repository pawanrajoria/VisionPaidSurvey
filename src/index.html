<!doctype html>
<html lang="en" class="orange_theme light-theme">

<head>
  <meta charset="utf-8">
  <title>Profitpiller – Opinion Research Platform</title>
  <base href="/">

  <!-- ✅ SEO (Neutral & Safe) -->
  <meta name="description"
    content="Profitpiller is an online opinion research platform where users can participate in surveys and research studies." />
  <meta name="robots" content="index, follow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="canonical" href="https://www.profitpiller.com" />

  <!-- ✅ Trust / Identity -->
  <meta name="author" content="Cralpk Research Pvt Ltd" />
  <meta name="copyright" content="© 2026 Cralpk Research Pvt Ltd" />
  <meta name="contact" content="support@profitpiller.com" />

  <!-- ✅ Open Graph (Neutral) -->
  <meta property="og:title" content="Profitpiller – Opinion Research Platform" />
  <meta property="og:description"
    content="Participate in online research surveys and share your opinions on Profitpiller." />
  <meta property="og:image" content="https://www.profitpiller.com/assets/images/og-image.png" />
  <meta property="og:url" content="https://www.profitpiller.com" />
  <meta property="og:type" content="website" />

  <!-- ✅ Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!--PreLoad Images-->
  <link rel="preload" as="image" href="/assets/images/backgrounds/rh-vps-bg.webp" fetchpriority="high">

  <!-- ✅ Fonts -->
  <!-- PERF: fonts are now loaded non-render-blocking via the preload+swap
       pattern instead of a plain <link rel="stylesheet">. The noscript
       fallback keeps fonts working with JS disabled. Roboto was removed
       entirely — it was imported but never referenced in any stylesheet
       ($font-family in _variables.scss is "DM Sans"); Material Icons (an
       icon *font*) is still needed for the ~60 ligature-style <mat-icon>
       usages in the authenticated/admin areas, just no longer blocking. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/icon?family=Material+Icons"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  </noscript>


  <script>(function (w, d, s, l, i) {
      w[l] = w[l] || []; w[l].push({
        'gtm.start':
          new Date().getTime(), event: 'gtm.js'
      }); var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
          'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
    })(window, document, 'script', 'dataLayer', 'GTM-5CM7Q4S3');</script>

  <!-- PERF: was a plain blocking <script src> — this is a 35KB unminified
       library that also does synchronous canvas/WebGL/audio fingerprinting
       work on load. `defer` stops it from blocking parsing/first paint.
       TODO(perf): you also have @fingerprintjs/fingerprintjs v5 as an npm
       dependency — worth consolidating onto one fingerprinting library
       (this file is the deprecated Fingerprint2 v2.1.5) rather than shipping
       both; left as-is here since removing it touches whatever reads its
       output (frauddetection.service.ts) and needs its own testing. -->
  <script src="/assets/js/fingerprint.js" defer></script>
  <link rel="manifest" href="assets/manifest.webmanifest">
</head>

<body class="mat-typography">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5CM7Q4S3" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <app-root></app-root>

  <noscript>
    Profitpiller requires JavaScript to function. Please enable JavaScript.
  </noscript>
</body>

</html>
