<mat-toolbar color="primary">
    <span>TapResearch</span>
    <span class="spacer"></span>
    <button mat-icon-button>
        <mat-icon>menu</mat-icon>
    </button>
</mat-toolbar>

<div class="coins-balance">
    <span class="balance">0 coins</span>
</div>

<div class="rewards-container">
    <h2>My Rewards: Freecash</h2>

    <mat-card class="stats-card">
        <mat-list>
            <mat-list-item>
                <span matLine>Session Total</span>
                <span class="value">0 coins</span>
            </mat-list-item>
            <mat-divider></mat-divider>
            <mat-list-item>
                <span matLine>This Month</span>
                <span class="value">0 coins</span>
            </mat-list-item>
            <mat-divider></mat-divider>
            <mat-list-item>
                <span matLine>Lifetime</span>
                <span class="value highlight">50 coins</span>
            </mat-list-item>
        </mat-list>
    </mat-card>

    <h3>Survey History</h3>
    <mat-card class="history-card">
        <p>Return to the survey wall to complete your first survey</p>
    </mat-card>
</div>
