<app-root-header></app-root-header>
<div class="landing-wrapper mat-elevation-z2">
    <div class="not-found-container">
        <div class="content">
            <mat-icon class="large-icon">error_outline</mat-icon>

            <h1 class="code">404</h1>
            <h2 class="title">{{ 'app.notFound.title' | translate }}</h2>
            <p class="message">
                {{ 'app.notFound.message' | translate }}
            </p>

            <div class="actions">
                <button mat-raised-button color="primary" routerLink="/">
                    {{ 'app.notFound.home' | translate }}
                </button>
                <button mat-stroked-button color="primary" (click)="goToApp()">
                    {{ 'app.notFound.back' | translate }}
                </button>
            </div>

            <div class="debug-info">
                <span class="label">{{ 'app.notFound.debugPath' | translate }}</span> {{ currentUrl }}
            </div>
        </div>
    </div>
</div>

<app-root-footer></app-root-footer>
