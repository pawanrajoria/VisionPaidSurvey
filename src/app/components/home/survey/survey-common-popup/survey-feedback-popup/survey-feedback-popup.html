<div class="popup-container animate-in">
    <div class="popup-header">
        <div class="icon-circle">
            <mat-icon>quiz</mat-icon>
        </div>
        <h2>What happened?</h2>
        <button mat-icon-button (click)="closeHappened()" class="close-icon">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <mat-dialog-content class="popup-body">
        <p class="instruction">You did not return from the survey yet</p>

        <mat-radio-group class="options-list" [(ngModel)]="selectedReason">
            <div class="option-row">
                <mat-radio-button value="1">I did not like the survey</mat-radio-button>
            </div>
            <div class="option-row">
                <mat-radio-button value="2">The survey asked for personal information</mat-radio-button>
            </div>
            <div class="option-row">
                <mat-radio-button value="3">The survey is broken/i con't continue</mat-radio-button>
            </div>
            <div class="option-row">
                <mat-radio-button value="4">Other</mat-radio-button>
            </div>
        </mat-radio-group>

        <div class="comment-section">
            <textarea class="custom-input" placeholder="Comments" rows="3"></textarea>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="center" class="popup-actions">
        <button mat-flat-button class="main-submit-btn" (click)="submitFeedback()">
            Submit
        </button>
    </mat-dialog-actions>
</div>
