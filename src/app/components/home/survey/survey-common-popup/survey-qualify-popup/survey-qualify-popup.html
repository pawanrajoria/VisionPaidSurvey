<div class="premium-success-popup animate-in">
    <button mat-icon-button class="close-btn" (click)="closeSurvey()" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
    </button>

    <mat-dialog-content class="premium-body">
        <div class="icon-orbit">
            <div class="icon-bg">
                <mat-icon>celebration</mat-icon>
            </div>
        </div>

        <div class="text-content">
            <h2>Success! You're Qualified</h2>
            <p class="subtitle">Get ready to earn. This high-value survey is reserved just for you.</p>
        </div>

        <div class="info-pills">
            <div class="pill">
                <mat-icon>timer</mat-icon>
                <span>~20 mins</span>
            </div>
            <div class="pill highlight">
                <mat-icon>trending_up</mat-icon>
                <span>High Reward</span>
            </div>
        </div>

        <button mat-flat-button class="action-btn-main" (click)="participateSurvey()">
            START EARNING NOW
            <mat-icon>bolt</mat-icon>
        </button>

        <div class="pro-tip-container">
            <div class="tip-header">
                <mat-icon>tips_and_updates</mat-icon>
                <span>PRO TIP</span>
            </div>
            <p>Using our daily partner dashboard reduces disqualification rates by 40%.</p>
        </div>
    </mat-dialog-content>
</div>
