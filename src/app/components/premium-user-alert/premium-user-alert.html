<div class="premium-card">
    <div class="premium-content">
        <div class="header-section">
            <div class="icon-badge">⭐</div>
            <h2>Premium Access</h2>
            <p>Maintain a high-quality account to unlock exclusive surveys and high-paying clients.</p>
        </div>

        <div class="checklist">
            <div class="check-item">
                <span class="dot"></span>
                <p>Earn at least <strong>$5</strong> successfully</p>
            </div>
            <div class="check-item">
                <span class="dot"></span>
                <p>Complete at least <strong>5 surveys</strong></p>
            </div>
            <div class="check-item">
                <span class="dot"></span>
                <p>Maintain a <strong>low rejection rate</strong></p>
            </div>
            <div class="check-item">
                <span class="dot"></span>
                <p>Receive <strong>one successful payout</strong></p>
            </div>
            <div class="check-item">
                <span class="dot"></span>
                <p>Keep account <strong>active & genuine</strong></p>
            </div>
        </div>
    </div>

    <div class="footer-section">
        <button class="confirm-btn" (click)="close()">
            Got It ({{countdown}}s)
        </button>
    </div>
</div>
