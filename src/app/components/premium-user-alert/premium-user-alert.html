<div class="premium-card">
    <div class="premium-content">
        <div class="header-section">
            <div class="icon-badge">⭐</div>
            <h2>{{ 'app.premium.title' | translate }}</h2>
            <p>{{ 'app.premium.intro' | translate }}</p>
        </div>

        <div class="checklist">
            <div class="check-item">
                <span class="dot"></span>
                <p [innerHTML]="'app.premium.item1' | translate"></p>
            </div>
            <div class="check-item">
                <span class="dot"></span>
                <p [innerHTML]="'app.premium.item2' | translate"></p>
            </div>
            <div class="check-item">
                <span class="dot"></span>
                <p [innerHTML]="'app.premium.item3' | translate"></p>
            </div>
            <div class="check-item">
                <span class="dot"></span>
                <p [innerHTML]="'app.premium.item4' | translate"></p>
            </div>
            <div class="check-item">
                <span class="dot"></span>
                <p [innerHTML]="'app.premium.item5' | translate"></p>
            </div>
        </div>
    </div>

    <div class="footer-section">
        <button class="confirm-btn" (click)="close()">
            {{ 'app.premium.gotIt' | translate:{ seconds: countdown } }}
        </button>
    </div>
</div>
