<div class="take-survey-wrapper" [class.is-dialog]="isDialog" [class.page-mode]="!isDialog">

  <!-- Header (Visible in Dialog Mode) -->
  <div class="dialog-header" *ngIf="isDialog">
    <div class="header-left">
      <mat-icon class="header-icon">badge</mat-icon>
      <div>
        <h3 class="header-title">{{ 'app.survey.screener.title' | translate }}</h3>
        <span class="header-subtitle">{{ 'app.survey.screener.sub' | translate }}</span>
      </div>
    </div>
    <button mat-icon-button (click)="dialogRef?.close()" class="close-btn" [attr.aria-label]="'app.common.close' | translate">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Main Body / Question Area -->
  <div class="survey-body-container" [class.dialog-scroll-body]="isDialog">
    <app-question *ngIf="!!qualification && !!qualification.qKey" [qualification]="qualification" [country]="country"
      (submitSurvey)="submitSurvey($event)">
    </app-question>
  </div>

</div>
