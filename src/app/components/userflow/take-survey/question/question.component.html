<form (ngSubmit)="onSubmit(this.form.value)" [formGroup]="form" class="form-horizontal screener-form">
  <div class="custom-container">
    <div class="row">
      <div class="col-md-6 m-auto">
        <mat-card appearance="outlined">
          <app-questionroot [field]="qualification" [form]="form"></app-questionroot>
          <div class="next-wrap">
            <button type="submit" mat-fab class="next-fab" [disabled]="!isValid"
              [attr.aria-label]="'app.common.next' | translate">
              <mat-icon>arrow_forward</mat-icon>
            </button>
          </div>
        </mat-card>
      </div>
    </div>
  </div>
</form>
