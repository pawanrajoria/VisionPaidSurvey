<div [formGroup]="form">
  <div class="search-box" *ngIf="!!field.qAnswers && field.qAnswers.length>10">
    <mat-icon>search</mat-icon>
    <input type="text" [formControlName]="field.searchingVariable" [placeholder]="'app.common.search' | translate" />
  </div>
  <div class="fixed-height-container">
    <div class="option-list">
      @for (opt of field.qAnswers | searchQuestion: form.controls['searchingVariable'].value; track opt) {
      <mat-checkbox class="option-card" [class.selected]="!!form.controls[opt.key]?.value" color="primary"
        [formControlName]="opt.key" (change)="updateAnswer($event)" [value]="opt.preCode" [checked]="opt.isChecked">
        {{opt.text}}</mat-checkbox>
      }
    </div>
  </div>
</div>
