<mat-card-header class="card-header-container">
  <div [formGroup]="form">
    <h3 *ngIf="!!field && field.qText" class="question-title">
      {{ field.qText }}<span class="text-danger" *ngIf="!!field && field.required"> *</span>
    </h3>
    <div class="row container-subquestion">
      <question-builder [field]="field" [form]="form"></question-builder>
    </div>
  </div>
</mat-card-header>
