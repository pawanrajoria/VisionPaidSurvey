<div class="cookie-consent">
  <button mat-icon-button (click)="closePopup()" aria-label="Close" class="close-button">
    <mat-icon>close</mat-icon>
  </button>

  <div class="cookie-text">
    <p>
      {{ 'cookiePolicy.text1' | translate }}
      <br />
      {{ 'cookiePolicy.text2' | translate }}
    </p>
  </div>

  <div class="actions">
    <button mat-flat-button color="primary" (click)="acceptCookies()">
      {{ 'cookiePolicy.accept' | translate }}
    </button>

    <button mat-flat-button color="error" (click)="rejectCookies()">
      {{ 'cookiePolicy.reject' | translate }}
    </button>

    <a mat-stroked-button  [routerLink]="['/', currentLang, 'cookie-policy']" class="setting-button">
      {{ 'cookiePolicy.settings' | translate }}
    </a>

    <!-- <button mat-button color="secondary" href="javascript://" (click)="" class="setting-button">
      {{ 'cookiePolicy.settings' | translate }}
    </button> -->
  </div>
</div>
