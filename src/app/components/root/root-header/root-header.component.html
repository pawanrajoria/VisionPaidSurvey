<div class="container-fluid">
    <div class="navbar my-custom-toolbar" [class.shrunk]="isShrunk">
        <div class="container">
            <div class="my-custom-toolbar-inner">
                <div class="navbar-left">
                    <a href="/">
                        <img loading="lazy" src="/assets/images/homepagelogo.png" alt="Profitpiller" class="logo" />
                    </a>
                </div>

                <span class="spacer"></span>
                <button matFab extended  [routerLink]="['/', currentLocale, 'auth', 'login']"
                    class="site-header-button rounded-pill border-0 d-sm-none">
                    {{ 'header.loginOrSignUp' | translate }}
                </button>

                <nav class="navbar-links">
                    <a mat-button class="nav-link" [routerLink]="['/', currentLocale, 'help']">{{ 'refer.title' | translate }}</a>
                    <a mat-button class="nav-link" [routerLink]="['/', currentLocale, 'cashout']">{{ 'header.earnRewards' | translate }}</a>
                    <a mat-button class="nav-link" [routerLink]="['/', currentLocale, 'amazongiftcard']">{{ 'header.redeemPoint' | translate }}</a>

                    <mat-divider vertical class="nav-divider"></mat-divider>

                    <button mat-button class="language my-custom-button" (click)="openTranslate()">
                        <mat-icon>public</mat-icon>
                        {{ 'header.language' | translate }}
                    </button>

                    <button mat-flat-button class="cta-button" (click)="goToApp()">
                        {{ 'header.goToApp' | translate }}
                    </button>
                </nav>

                <button mat-icon-button class="mobile-menu-btn" [attr.aria-label]="'app.nav.openMenu' | translate" (click)="toggleMobileMenu()">
                    <mat-icon>menu</mat-icon>
                </button>
            </div>
        </div>
        <div class="container">
            <div class="live-payout">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="trending-nows-aera">
                            <div class="live-payouts"><span class="blink"></span> {{ 'header.livePayouts' | translate }}
                            </div>
                            <!-- Real completed cash-outs (api/app/recent-payouts); without any, the real payout methods. -->
                            <div class="card-list">
                                @for (p of payouts; track $index) {
                                <div class="payout-item">
                                    <div class="d-flex"><img loading="lazy" [src]="iconFor(p.method)" width="20" class="payout-item-img" [alt]="p.method">
                                        <span class="title m-l-2">{{ p.method }}</span>
                                    </div>
                                    @if (p.amountUsd > 0) { <span class="price">{{ p.amountUsd | currency:'USD':'symbol':'1.0-2' }}</span> }
                                </div>
                                }
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="clear-fix"></div>

</div>
