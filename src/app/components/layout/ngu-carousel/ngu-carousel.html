<ngu-carousel #myCarousel [inputs]="carouselTileConfig" [dataSource]="carouselItemsArray">
    <button NguCarouselPrev class="leftRs" [style.opacity]="myCarousel.isFirst() ? 0.5 : 1">
        &lt;
    </button>

    <!-- <div class="offer-grid"> -->
    <ngu-tile *nguCarouselDef="let item; index as i; let ani = animate" [@slider]="ani">

        <div class="tile" [style.background]="'url(' + item + ')'">
            <h1>{{ i + 1 }}</h1>
        </div>

    </ngu-tile>
    <!-- </div> -->

    <button NguCarouselNext class="rightRs" [style.opacity]="myCarousel.isLast() ? 0.5 : 1">
        &gt;
    </button>

    <ul class="myPoint" NguCarouselPoint>
        <li *ngFor="let i of myCarousel.pointNumbers(); trackBy: trackByIndex"
            [class.active]="i === myCarousel.activePoint()" (click)="myCarousel.moveTo(i)">
        </li>
    </ul>
</ngu-carousel>
