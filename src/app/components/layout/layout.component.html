<mat-sidenav-container class="mainWrapper" autosize autoFocus dir="ltr">
    <mat-sidenav #leftsidenav [mode]="isOver ? 'over' : 'side'" [opened]="!isOver"
        (openedChange)="onSidenavOpenedChange($event)" (closedStart)="onSidenavClosedStart()" class="sidebarNav">
        <div class="flex-layout">
            <app-sidebar (toggleMobileNav)="sidenav.toggle()" [showToggle]="isOver"></app-sidebar>
            <ng-scrollbar class="position-relative" style="height: 100%">
                <mat-nav-list class="sidebar-list">
                    @if(allowedMenus && allowedMenus.length > 0) {
                    @for(item of allowedMenus; track item.route) {
                    <app-nav-item [item]="item" (notify)="sidenav.toggle()"></app-nav-item>
                    }
                    } @else {
                    <mat-list-item>Loading...</mat-list-item>
                    }
                </mat-nav-list>
            </ng-scrollbar>
        </div>
    </mat-sidenav>

    <mat-sidenav-content class="contentWrapper" #content>
        @if (activeNotification) {
        <div class="top-notification-banner" [class.show]="activeNotification">
            <div class="notification-content">
                <mat-icon>notifications_active</mat-icon>
                <div class="text">
                    <strong>{{ activeNotification.title }}</strong>
                    <p>{{ activeNotification.body }}</p>
                </div>
                <button mat-icon-button (click)="activeNotification = null">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
        </div>
        }

        <app-header [showToggle]="!isOver" [notificationCount]="notificationHistory.length"
            [notificationHistory]="notificationHistory" (toggleMobileNav)="sidenav.toggle()"
            (removeNotification)="clearNotifications()">
        </app-header>

        <main class="pageWrapper maxWidth">
            <router-outlet></router-outlet>
        </main>

        <div class="p-16 p-t-8 p-b-30 text-center">
            Design & Developed by <a class="text-decoration-none" href="https://profitpiller.com/"
                target="_blank">profitpiller.com</a>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
