<div class="side-head">
  <div class="branding"><app-branding></app-branding></div>

  <div class="side-actions">
    <!-- Language: always visible, shows the language in use -->
    <button type="button" class="lang-chip" (click)="openTranslate()" aria-label="Change language" title="Change language">
      <mat-icon>language</mat-icon>
      <span>{{ langCode }}</span>
    </button>

    @if (showToggle) {
    <button type="button" class="close-btn" (click)="toggleMobileNav.emit()" aria-label="Close menu">
      <mat-icon>close</mat-icon>
    </button>
    }
  </div>
</div>
