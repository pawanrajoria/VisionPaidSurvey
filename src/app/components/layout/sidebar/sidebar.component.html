<div class="side-head">
  <div class="branding"><app-branding></app-branding></div>

  <div class="side-actions">
    <!-- Language: always visible, shows the language in use -->
    <button type="button" class="lang-chip" (click)="openTranslate()" [attr.aria-label]="'app.nav.changeLanguage' | translate" [title]="'app.nav.changeLanguage' | translate">
      <mat-icon>language</mat-icon>
      <span>{{ langCode }}</span>
    </button>

    @if (showToggle) {
    <button type="button" class="close-btn" (click)="toggleMobileNav.emit()" [attr.aria-label]="'app.nav.closeMenu' | translate">
      <mat-icon>close</mat-icon>
    </button>
    }
  </div>
</div>
