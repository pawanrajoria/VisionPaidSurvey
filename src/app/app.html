<mat-progress-bar *ngIf="isLoading$ | async" mode="indeterminate" color="primary" class="top-loader"></mat-progress-bar>
<app-message></app-message>
<div class="loader-overlay" *ngIf="isLoading$ | async">
    <mat-spinner diameter="50" color="primary"></mat-spinner>
</div>

<ng-container *ngIf="translationsLoadedInfo; else loading">
  <router-outlet></router-outlet>
</ng-container>


<ng-template #loading>
    <div class="splash-screen">Loading...</div>
</ng-template>
