<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" role="img" aria-label="Turn on notifications to get offer updates">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17715f"/>
      <stop offset="1" stop-color="#0b3d33"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#f5a301"/>
    </linearGradient>
  </defs>

  <rect width="240" height="140" rx="16" fill="url(#bg)"/>
  <circle cx="214" cy="14" r="46" fill="#ffffff" opacity=".06"/>
  <circle cx="18" cy="132" r="40" fill="#ffffff" opacity=".05"/>

  <!-- bell with sound waves -->
  <g transform="translate(-2 4)">
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="2.5" opacity=".5">
      <path d="M22 40c-6 6-6 20 0 26"/>
      <path d="M78 40c6 6 6 20 0 26"/>
    </g>
    <g transform="rotate(-10 50 52)">
      <rect x="45" y="20" width="10" height="10" rx="5" fill="#f5a301"/>
      <path d="M50 26c-14 0-23 10-23 24v10c0 5-2 8-6 11h58c-4-3-6-6-6-11V50c0-14-9-24-23-24z" fill="url(#bell)"/>
      <path d="M38 36c5-5 11-6 17-5" fill="none" stroke="#fff3c4" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
      <rect x="21" y="71" width="58" height="6" rx="3" fill="#e08e00"/>
      <path d="M43 78a7 7 0 0 0 14 0z" fill="#e08e00"/>
    </g>
    <!-- badge -->
    <circle cx="70" cy="26" r="10" fill="#e5484d" stroke="#0b3d33" stroke-width="2.5"/>
    <text x="70" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">1</text>
  </g>

  <!-- message -->
  <g font-family="Inter, Arial, sans-serif">
    <text x="96" y="40" font-size="13" font-weight="800" fill="#ffffff">Get updates first</text>
    <text x="96" y="58" font-size="10.5" fill="#d7efe8">New offers, bonus</text>
    <text x="96" y="72" font-size="10.5" fill="#d7efe8">points &amp; payout alerts</text>
  </g>

  <!-- coins -->
  <g>
    <circle cx="212" cy="104" r="11" fill="#f5a301"/>
    <circle cx="212" cy="104" r="7" fill="none" stroke="#ffe08a" stroke-width="2"/>
    <circle cx="196" cy="116" r="8" fill="#f5a301" opacity=".85"/>
  </g>

  <!-- call to action -->
  <rect x="20" y="98" width="148" height="28" rx="14" fill="#ffffff"/>
  <path d="M34 106.5a5 5 0 0 0-5 5v3l-2 2h14l-2-2v-3a5 5 0 0 0-5-5zm-1.6 11.5a1.6 1.6 0 0 0 3.2 0z" fill="#105749"/>
  <text x="100" y="116.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#105749">Click to enable on web</text>
</svg>
